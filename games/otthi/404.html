<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voltar ao OTTHI World</title>
</head>
<body>
<main><h1>Voltar ao Mundo Aberto</h1><p>Este endereço não está disponível.</p><a id="world-return" href="./">Abrir o Mundo Aberto</a></main>
<script>
  const url = new URL(location.href);
  const boundary = url.pathname.lastIndexOf('/games/otthi/');
  if (boundary >= 0) {
    url.pathname = url.pathname.slice(0, boundary) + '/games/otthi/';
    url.search = '';
    url.hash = '';
    document.getElementById('world-return').href = url.href;
  }
</script>
</body>
</html>
