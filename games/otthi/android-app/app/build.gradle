plugins {
    id 'com.android.application'
}

def otthiStoreFile = System.getenv('OTTHI_STORE_FILE')
def otthiStorePassword = System.getenv('OTTHI_STORE_PASSWORD')
def otthiKeyAlias = System.getenv('OTTHI_KEY_ALIAS')
def otthiKeyPassword = System.getenv('OTTHI_KEY_PASSWORD')
def otthiSigningReady = otthiStoreFile && otthiStorePassword && otthiKeyAlias && otthiKeyPassword

android {
    namespace 'br.com.thiaguinhosolucoes.otthos'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.thiaguinhosolucoes.otthos'
        minSdk 24
        targetSdk 35
        versionCode 70593
        versionName "704.16.0"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (otthiSigningReady) {
                storeFile file(otthiStoreFile)
                storePassword otthiStorePassword
                keyAlias otthiKeyAlias
                keyPassword otthiKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (otthiSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
