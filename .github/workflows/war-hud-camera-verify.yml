# Reexecução: impedir sobreposição entre recarga e joystick nos formatos estreitos.
name: Validar controles compactos e câmera WAR sem publicação
on:
  push:
    branches: [war-controles-sem-sobreposicao-20261102]
    paths: ['.github/workflows/war-hud-camera-verify.yml']
permissions:
  contents: write
jobs:
  war-compact-qa:
    if: github.ref == 'refs/heads/war-controles-sem-sobreposicao-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar somente hashes relacionados ao WAR
        run: |
          set -euo pipefail
          python3 games/otthi/tools/build_project.py
          while IFS= read -r path; do
            case "$path" in
              games/otthi/index.html|games/otthi/sw.js|games/otthi/release-manifest.json) ;;
              *) echo "Arquivo inesperado: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
      - name: Instalar Chromium para testar toque
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Testar HUD, recalibração, tiro e joystick em seis formatos
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/war-hud-http.log 2>&1 &
          sleep 2
          node tests/war-touch-browser.mjs
          node --test tests/war-mobile-control-modes.test.mjs tests/war-survival-rotation.test.mjs tests/world-integrity.test.mjs
      - name: Guardar provas visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: war-hud-compact-six-viewports
          path: test-results/war-touch/
          if-no-files-found: ignore
          retention-days: 14
      - name: Gravar somente metadados e remover este verificador
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- games/otthi/index.html games/otthi/sw.js games/otthi/release-manifest.json
          git rm .github/workflows/war-hud-camera-verify.yml
          git commit -m "test(war): validated six-viewport compact controls and updated integrity hashes"
          git push origin HEAD:refs/heads/war-controles-sem-sobreposicao-20261102
