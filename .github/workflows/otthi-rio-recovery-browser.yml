name: OTThi Rio Preto - browser acceptance on isolated recovery
on:
  push:
    branches: [fix/otthi-rio-preto-recovery-20261123, feat/otthi-sims-home-living-20261123, feat/otthi-regions-simulator-20261123]
    paths:
      - 'games/otthi/**'
      - 'tests/rio-compact-world-browser.mjs'
      - '.github/workflows/otthi-rio-recovery-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-rio-compacto:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Run actual Rio Preto smartphone browser acceptance
        run: node tests/rio-compact-world-browser.mjs
      - name: Save screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rio-preto-recovery-real-browser
          path: test-results/rio-compact-world/
          if-no-files-found: ignore
          retention-days: 14
