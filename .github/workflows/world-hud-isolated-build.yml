name: Conferir HUD original e modo OT Games sem sobreposições
on:
  push:
    branches: [world-hud-separar-modos-20261102]
    paths:
      - '.github/workflows/world-hud-isolated-build.yml'
permissions:
  contents: write
jobs:
  verify-world-hud:
    if: github.ref == 'refs/heads/world-hud-separar-modos-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar o CSS derivado preservando o restante do mundo
        run: |
          set -euo pipefail
          python3 games/otthi/tools/build_project.py
          while IFS= read -r path; do
            case "$path" in
              games/otthi/style.css|games/otthi/src/module-order.json|games/otthi/index.html|games/otthi/sw.js|games/otthi/release-manifest.json) ;;
              *) echo "Alteração não autorizada: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
      - name: Testar integridade do mundo e motores existentes
        run: node --test tests/world-integrity.test.mjs tests/world-traffic-route-metrics.test.mjs tests/world-runtime-performance.test.mjs
      - name: Instalar navegador de teste
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Validar alternância entre HUDs no celular em retrato e paisagem
        run: node tests/world-hud-modes-browser.mjs
      - name: Guardar provas de retrato e paisagem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-hud-separated-modes
          path: test-results/world-hud-modes/
          retention-days: 14
          if-no-files-found: ignore
      - name: Gravar apenas o CSS derivado e metadados, retirar fluxo temporário
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- games/otthi/style.css games/otthi/src/module-order.json games/otthi/index.html games/otthi/sw.js games/otthi/release-manifest.json
          git rm .github/workflows/world-hud-isolated-build.yml
          git commit -m "build(world): separate original HUD from OT Games overlay"
          git push origin HEAD:refs/heads/world-hud-separar-modos-20261102
