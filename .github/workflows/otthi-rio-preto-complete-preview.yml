name: OTThi Rio Preto - build and regression (isolated preview)
on:
  push:
    branches:
      - feat/otthi-rio-preto-completo-20261123
      - fix/otthi-rio-preto-recovery-20261123
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/feat/otthi-rio-preto-completo-20261123' || github.ref == 'refs/heads/fix/otthi-rio-preto-recovery-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the native modular World and update release hashes
        run: python3 games/otthi/tools/build_project.py
      - name: Syntax and targeted regression tests
        run: |
          node --check games/otthi/app.js
          node --test tests/rio-compact-layout.test.mjs tests/rio-wardrobe.test.mjs tests/world-integrity.test.mjs tests/rio-preto-districts.test.mjs tests/rio-map-geography.test.mjs tests/world-multiplayer-presence-resilience.test.mjs
          node tests/world-integrity.mjs
          git diff --check
      - name: Record generated runtime only after all tests pass
        run: |
          git config user.name 'ConsoleGames Preview Build'
          git config user.email 'console-preview-build@users.noreply.github.com'
          git add games/otthi/app.js games/otthi/style.css games/otthi/sw.js games/otthi/index.html games/otthi/release-manifest.json games/otthi/src/module-order.json
          if git diff --cached --quiet; then
            echo "Native build already synchronized."
          else
            git commit -m 'chore(otthi): sync validated Rio Preto preview runtime'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
