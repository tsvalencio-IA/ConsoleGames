name: Verificar PWA único em 8 jogos
on:
  push:
    branches: [release/console-unificado-20261116, 'fix/integracao-console-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build oficial
        run: python3 games/otthi/tools/build_project.py
      - name: Preparar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir console sem Firebase real
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/console-http.log 2>&1 &
          sleep 2
      - name: Testar manifesto único e retorno em 8 jogos
        run: node tests/console-canonical-browser.mjs
      - name: Percorrer catálogo, favoritos e portais em raiz e subpasta
        run: node tests/console-integrated-navigation-browser.mjs
