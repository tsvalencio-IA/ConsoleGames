name: Verificar controles, giro e carga online
on:
  push:
    branches: ['world-mobile-20261105', 'console-evolution-20261106']
    paths: ['.github/workflows/world-mobile-repair.yml', 'games/otthi/**', 'tests/world-mobile-layout-browser.mjs', 'tests/world-play-performance.mjs', 'tests/world-vehicle-performance.mjs', 'tests/helpers/world-rtdb-browser-fixture.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-mobile-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  veiculo-e-motor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - name: Medir entrada e direcao com motor real e familia
        env:
          OT_VEHICLE_BASELINE: 1b97926979dc54abe040adfbb145c5915ce7c138
        run: node tests/world-vehicle-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-vehicle-performance
          path: test-results/world-vehicle-performance/
  controles-e-giro:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/world-integrity.mjs
      - name: Comparar todos os pixels das instâncias
        run: node tests/world-instance-culling-browser.mjs
      - name: Reproduzir os defeitos da versão recebida
        env:
          WORLD_UI_REVISION: cc2437b7a03d784fa219c9327d97880688835736
          WORLD_UI_REPORT_ONLY: '1'
        run: node tests/world-mobile-layout-browser.mjs
      - name: Conferir controles e dez giros sem recarregar
        run: node tests/world-mobile-layout-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-mobile-layout
          path: |
            test-results/world-mobile-*/
            test-results/world-instance-culling/
  carga-online:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - name: Comparar partida online isolada sem limitar os desenhos
        env:
          OT_LIVE_BASELINE: cc2437b7a03d784fa219c9327d97880688835736
          OT_LIVE_SECONDS: '15'
          OT_LIVE_ONLINE: '1'
          OT_LIVE_OUT: test-results/world-online-performance
        run: node tests/world-play-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-mobile-performance
          path: test-results/world-online-performance/
