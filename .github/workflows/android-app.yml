name: Gerar e instalar aplicativo Android
on:
  push:
    paths: ['android/**', 'arcade/downloads/**', '.github/workflows/android-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar aplicativo e teste Android
        working-directory: android
        run: gradle --no-daemon assembleRecoveryRelease assembleRecoveryDebug assembleRecoveryDebugAndroidTest lintRecoveryRelease
      - name: Preparar APK sem chave privada no CI
        run: |
          mkdir -p android-delivery
          cp android/app/build/outputs/apk/recovery/release/app-recovery-release-unsigned.apk android-delivery/arcade-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-delivery/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-delivery/arcade-unsigned.apk > android-delivery/apk-manifest.txt
          sha256sum android-delivery/arcade-unsigned.apk > android-delivery/SHA256SUMS
      - name: Habilitar aceleração do emulador
        run: sudo chmod 666 /dev/kvm
      - name: Instalar e abrir no Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell am force-stop com.android.launcher3
            adb shell input keyevent 4
            SIGNED_ARCADE_APK=arcade/downloads/thIAguinho-ARCADE.apk
            if [ -f arcade/downloads/thIAguinho-ARCADE-OT.apk ]; then SIGNED_ARCADE_APK=arcade/downloads/thIAguinho-ARCADE-OT.apk; fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED_ARCADE_APK" > android-delivery/signed-verification.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SIGNED_ARCADE_APK" > android-delivery/signed-apk-manifest.txt
            adb install "$SIGNED_ARCADE_APK"
            adb shell am start -W -n br.com.thiaguinhosolucoes.arcade/.MainActivity
            sleep 4
            adb shell pidof br.com.thiaguinhosolucoes.arcade
            adb exec-out screencap -p > android-delivery/android-signed-release.png
            adb uninstall br.com.thiaguinhosolucoes.arcade
            adb install android/app/build/outputs/apk/recovery/debug/app-recovery-debug.apk
            adb install android/app/build/outputs/apk/androidTest/recovery/debug/app-recovery-debug-androidTest.apk
            adb shell am instrument -w br.com.thiaguinhosolucoes.arcade.test/br.com.thiaguinhosolucoes.arcade.ArcadeSmoke | tee android-delivery/android-install-test.txt
            adb pull /sdcard/Android/data/br.com.thiaguinhosolucoes.arcade/files android-delivery/screenshots || true
            adb logcat -d -s AndroidRuntime chromium WebViewFactory > android-delivery/android-webview.log
            python3 -c "from pathlib import Path; assert 'Android: installed' in Path('android-delivery/android-install-test.txt').read_text()"
      - name: Guardar pacote para assinatura final e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-install-package
          path: android-delivery/
          retention-days: 7
