name: Medir carga real do mundo
on:
  push:
    branches: ['world-fluidez-20261105']
    paths:
      - '.github/workflows/world-performance-repair.yml'
      - 'games/otthi/src/modules/**'
      - 'tests/world-frame-budget.test.mjs'
      - 'tests/world-frame-profile.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-performance-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  carga-do-mundo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de medição
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Medir a simulação publicada
        env:
          WORLD_PERF_LABEL: before
          WORLD_PERF_REVISION: 043d82abcc9d3b2e743fd72e49debc2aeb508353
        run: node tests/world-frame-profile.mjs
      - name: Medir a simulação corrigida
        env:
          WORLD_PERF_LABEL: after
        run: node tests/world-frame-profile.mjs
      - name: Comparar todos os canais da iluminação visível
        run: node tests/world-light-budget-browser.mjs
      - name: Medir quadros nativos sem limitar o renderizador
        env:
          OT_LIVE_BASELINE: 043d82abcc9d3b2e743fd72e49debc2aeb508353
          OT_LIVE_SECONDS: '12'
          OT_LIVE_PROFILE: '1'
          OT_LIVE_SHADERS: '1'
        run: node tests/world-play-performance.mjs
      - name: Guardar medições e imagens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-performance-repair
          path: |
            test-results/world-frame-before/
            test-results/world-frame-after/
            test-results/world-live-performance/
          if-no-files-found: ignore
