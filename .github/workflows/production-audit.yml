name: Auditar site publicado - thIAguinho ARCADE
on:
  workflow_run:
    workflows: ['Verificar console']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparar arquivos publicados com código aprovado (SHA-256)
        run: |
          for attempt in 1 2 3 4; do
            if node tests/production-audit.mjs > /tmp/publication-audit.log 2>&1; then
              cat /tmp/publication-audit.log
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo 'Aguardando a publicação dos arquivos desta revisão...'
              sleep 15
            fi
          done
          cat /tmp/publication-audit.log
          exit 1
      - name: Conferir download público do aplicativo Android
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const paths=['arcade/downloads/thIAguinho-ARCADE.apk','arcade/downloads/release.json','arcade/downloads/SHA256SUMS.txt'];
          await Promise.all(paths.map(async path=>{
            const expected=readFileSync(path);
            for(let attempt=0;attempt<5;attempt++){
              try{
                const response=await fetch('https://tsvalencio-ia.github.io/ConsoleGames/'+path+'?verify='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});
                assert(response.ok,'HTTP '+response.status);
                assert(Buffer.from(await response.arrayBuffer()).equals(expected),'Download diferente do arquivo assinado');
                console.log('Android publicado e íntegro:',path,expected.length,'bytes');return;
              }catch(error){if(attempt===4)throw error;await new Promise(resolve=>setTimeout(resolve,5000));}
            }
          }));
          JS
