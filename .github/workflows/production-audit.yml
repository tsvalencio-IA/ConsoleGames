name: Auditar site publicado - thIAguinho ARCADE
on:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparar arquivos publicados com código aprovado (SHA-256)
        run: node tests/production-audit.mjs
