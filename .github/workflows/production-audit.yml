name: Auditar site publicado - thIAguinho ARCADE
on:
  workflow_run:
    workflows: ['Verificar console']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparar arquivos publicados com código aprovado (SHA-256)
        run: |
          for attempt in 1 2 3 4; do
            if node tests/production-audit.mjs > /tmp/publication-audit.log 2>&1; then
              cat /tmp/publication-audit.log
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo 'Aguardando a publicação dos arquivos desta revisão...'
              sleep 15
            fi
          done
          cat /tmp/publication-audit.log
          exit 1
