name: Reconstruir manifesto de integridade do HUD WAR em branch de teste
on:
  push:
    branches: [war-controles-sem-sobreposicao-20261102]
    paths: ['.github/workflows/war-hud-integrity-branch.yml']
permissions:
  contents: write
jobs:
  verify-war-hud:
    if: github.ref == 'refs/heads/war-controles-sem-sobreposicao-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar somente metadados de integridade vinculados ao WAR
        run: |
          set -euo pipefail
          python3 games/otthi/tools/build_project.py
          while IFS= read -r path; do
            case "$path" in
              games/otthi/index.html|games/otthi/sw.js|games/otthi/release-manifest.json) ;;
              *) echo "Arquivo inesperado alterado: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
      - name: Testar integridade e motores já existentes
        run: |
          node --test tests/world-integrity.test.mjs tests/mastery.test.mjs tests/war-mobile-control-modes.test.mjs tests/war-survival-rotation.test.mjs tests/war-camera-body-only.test.mjs
      - name: Confirmar somente arquivos derivados e remover este fluxo temporário
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- games/otthi/index.html games/otthi/sw.js games/otthi/release-manifest.json
          git rm .github/workflows/war-hud-integrity-branch.yml
          git commit -m "build(war): link HUD responsive layout to original integrity manifest"
          git push origin HEAD:refs/heads/war-controles-sem-sobreposicao-20261102
