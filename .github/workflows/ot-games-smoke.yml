name: Câmera frontal e modos no mundo OT
on:
  push:
    paths:
      - '.github/workflows/ot-games-smoke.yml'
      - 'games/ar/**'
      - 'games/voo/**'
      - 'games/otthi/**'
      - 'tests/war-*'
      - 'tests/ot-games*'
      - 'tests/fixtures/hand/**'
      - 'tests/helpers/console-context.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ot-games-camera-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera-e-mundo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Servir jogos
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ot-games-server.log 2>&1 &
          sleep 2
      - name: Reconhecer mãos com o modelo real e jogar pela câmera frontal
        run: node tests/war-camera-browser.mjs
      - name: Inferência real do corpo e controle por objeto no WAR original
        run: |
          node tests/war-body-model-browser.mjs
          node tests/war-object-browser.mjs
      - name: Corpo e mão reais na mesma câmera
        run: node tests/war-joint-camera-browser.mjs
      - name: Guardar diagnóstico imediato de câmera
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: war-joint-camera-diagnostic
          path: test-results/war-joint-camera/
          if-no-files-found: ignore
          retention-days: 14
      - name: Conferir as três operações em retrato e paisagem
        if: ${{ always() && !cancelled() }}
        run: node tests/war-campaign-browser.mjs
      - name: Atualização completa sem interromper a partida
        if: ${{ always() && !cancelled() }}
        run: |
          python3 games/otthi/tools/build_project.py
          python3 tools/package-world-preview.py
          node tests/war-update-browser.mjs
      - name: Arrastar a câmera e jogar com toques simultâneos no WAR
        if: ${{ always() && !cancelled() }}
        run: node tests/war-touch-browser.mjs
      - name: Testar ações civis, teleférico, oficina e missões no mundo OT
        if: ${{ always() && !cancelled() }}
        run: |
          node tests/world-civil-browser.mjs
          node tests/world-civil-multiplayer-browser.mjs
          node tests/world-workshop-bays-browser.mjs
      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ot-games-hand-camera-world
          path: |
            test-results/hand-camera/
            test-results/war-touch/
            test-results/war-body/
            test-results/war-object/
            test-results/war-joint-camera/
            test-results/war-campaign/
            test-results/war-update/
            test-results/world-civil-native/
            test-results/world-civil-multiplayer/
            test-results/workshop-bays/
          if-no-files-found: ignore
          retention-days: 14
