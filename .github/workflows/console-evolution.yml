name: Validar evolução do console e entregas
on:
  push:
    branches: ['console-evolution-20261106']
    paths: ['games/**', 'tests/**', '.github/workflows/console-evolution.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: console-evolution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transito-e-fluidez:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: git fetch --depth=1 origin 175ba82b7bdd46637cca6854a32517971d85200a
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node --test tests/world-traffic-flow.test.mjs tests/world-phone-orders.test.mjs
      - run: node tests/world-traffic-flow-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-traffic-flow-and-cpu
          path: test-results/world-traffic-flow/
  celular-rotas-e-compras:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node --test tests/world-phone-orders.test.mjs
      - run: node tests/world-phone-orders-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-phone-orders-and-routes
          path: test-results/world-phone-orders/
  celular-e-entregas:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/world-integrity.mjs
      - run: node tests/dance-console-browser.mjs
      - run: node tests/world-phone-browser.mjs
      - run: node tests/world-air-fleet-multiplayer-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-phone-and-aircraft
          path: |
            test-results/world-phone/
            test-results/dance-console/
            test-results/air-fleet-multiplayer/
  pouso:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/flight-runway-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-runway
          path: test-results/flight-runway/
  duas-maos:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/war-touch-browser.mjs
      - run: node tests/war-dual-hands-browser.mjs
      - run: node tests/war-joint-camera-browser.mjs
      - run: node tests/war-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-two-hand-controls
          path: |
            test-results/war-dual-hands/
            test-results/war-joint-camera/
            test-results/war-review/
  atualizacao-da-candidata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - name: Instalar a candidata HTTPS com progresso existente
        env:
          WORLD_RELEASE_ORIGIN: https://otthi-world-campanha-teste-git-con-4e200f-thiaguinho-s-projects.vercel.app
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, time, urllib.request
          expected = json.loads(Path('games/otthi/release-manifest.json').read_text())['revision']
          manifest_url = os.environ['WORLD_RELEASE_ORIGIN'] + '/games/otthi/release-manifest.json?verify=' + expected
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(manifest_url, timeout=10) as response:
                      actual = json.load(response).get('revision')
                  if actual == expected:
                      break
                  print('Aguardando publicação da candidata:', actual, '->', expected, flush=True)
              except Exception as error:
                  print('Candidata ainda indisponível:', type(error).__name__, flush=True)
              time.sleep(3)
          else:
              raise RuntimeError('A candidata HTTPS não publicou a revisão esperada.')
          source = Path('tests/world-update-public-browser.mjs').read_text()
          marker = "const origin='https://otthi-world-campanha-teste.vercel.app'"
          assert source.count(marker) == 1
          source = source.replace(marker, 'const origin=' + json.dumps(os.environ['WORLD_RELEASE_ORIGIN']), 1)
          Path('tests/.candidate-update-browser.mjs').write_text(source)
          PY
          node tests/.candidate-update-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-candidate-update
          path: test-results/world-update-public/
  kart-precisao-e-copa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/kart-cup-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-kart-cup
          path: test-results/kart-cups/
  oficina-autonoma:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/world-workshop-auto-browser.mjs
      - run: node tests/world-workshop-bays-browser.mjs
      - run: node tests/world-civil-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-workshop-auto
          path: |
            test-results/workshop-auto/
            test-results/workshop-bays/
            test-results/world-civil-native/
