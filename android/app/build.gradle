plugins { id 'com.android.application' }
android {
    namespace 'br.com.thiaguinhosolucoes.arcade'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.thiaguinhosolucoes.arcade'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'br.com.thiaguinhosolucoes.arcade.ArcadeSmoke'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
