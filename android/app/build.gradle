plugins { id 'com.android.application' }
android {
    namespace 'br.com.thiaguinhosolucoes.arcade'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.thiaguinhosolucoes.arcade'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'br.com.thiaguinhosolucoes.arcade.ArcadeSmoke'
        buildConfigField 'String', 'CONSOLE_URL', '"https://tsvalencio-ia.github.io/ConsoleGames/arcade/?android=1"'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'server'
    productFlavors {
        production { dimension 'server' }
        recovery {
            dimension 'server'
            versionCode 2
            versionName '1.1.0'
            buildConfigField 'String', 'CONSOLE_URL', '"https://otthi-world-campanha-teste.vercel.app/arcade/?android=1"'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
